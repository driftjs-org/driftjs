packages:
  - 'packages/*'
  - 'playground'
  - 'benchmarks'
  - 'benchmarks/runner'
  - 'benchmarks/runner/app'
  - 'benchmarks/frameworks/*'
  - 'docs'
allowBuilds:
  '@vscode/vsce-sign': true
  keytar: true
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.3'
overrides:
  typescript: '^6.0.3'
