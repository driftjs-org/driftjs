name: DevTools Cross-Browser Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release DevTools Extensions
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Monorepo Packages
        run: pnpm build

      - name: Build Firefox DevTools Package
        run: pnpm --filter devtool build:firefox

      - name: Build Chrome / Edge DevTools Package
        run: pnpm --filter devtool build:chrome

      - name: Sign Firefox Add-on via AMO
        id: sign-amo
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx --yes web-ext sign \
            --source-dir devtool/dist/firefox \
            --artifacts-dir devtool/dist/firefox-signed \
            --api-key "${AMO_JWT_ISSUER}" \
            --api-secret "${AMO_JWT_SECRET}" \
            --channel listed || true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            devtool/drift-devtools-firefox.zip
            devtool/drift-devtools-chrome.zip
            devtool/dist/firefox-signed/*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
